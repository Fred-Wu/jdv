<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jdv local viewer</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>jdv</h1>
        <p>A local viewer for R data frames and matrices.</p>
      </header>
      <section aria-live="polite"
        id="status">Connecting to the local viewer…</section>
      <section id="sessions" aria-label="R sessions"></section>
      <section id="tables" aria-label="Open tables"></section>
    </main>
  </body>
</html>
